<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCanteen AI — Intelligent College Queue Management</title>
  <meta name="description" content="AI-powered college canteen queue management prototype with live computer-vision density estimation and predictive wait-time forecasting.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
                950: '#082f49',
              }
            }
          }
        }
      };
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased selection:bg-sky-500 selection:text-white">
  
  <!-- Main React/SPA App Mount Target -->
  <div id="root"></div>

  <!-- Toast Notification Container -->
  <div id="app-toast" class="fixed bottom-6 right-6 z-50 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none font-mono text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 backdrop-blur-xl border"></div>

  <!-- 1. Data Layer -->
  <script src="js/data/initialData.js"></script>
  <script src="js/data/simulationEngine.js"></script>

  <!-- 2. UI Components & Icon Library -->
  <script src="js/components/icons.js"></script>
  <script src="js/components/MetricCard.js"></script>
  <script src="js/components/CrowdIndicator.js"></script>
  <script src="js/components/PredictionCharts.js"></script>
  <script src="js/components/CameraMonitor.js"></script>
  <script src="js/components/AIInsightCard.js"></script>
  <script src="js/components/Sidebar.js"></script>
  <script src="js/components/Navbar.js"></script>

  <!-- 3. Application Pages -->
  <script src="js/components/pages/LandingPage.js"></script>
  <script src="js/components/pages/DashboardPage.js"></script>
  <script src="js/components/pages/OrderPage.js"></script>
  <script src="js/components/pages/LiveQueuePage.js"></script>
  <script src="js/components/pages/PredictionPage.js"></script>
  <script src="js/components/pages/StudentViewPage.js"></script>
  <script src="js/components/pages/StaffDashboardPage.js"></script>
  <script src="js/components/pages/AnalyticsPage.js"></script>
  <script src="js/components/pages/AlertsPage.js"></script>
  <script src="js/components/pages/ArchitecturePage.js"></script>
  <script src="js/components/pages/TechEthicsPage.js"></script>
  <script src="js/components/pages/SettingsPage.js"></script>

  <!-- 4. Main App Controller -->
  <script src="js/app.js"></script>
</body>
</html>
